[package]
name = "llflash_test_framework"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
llflash_core = { path = "../../core", features = ["deterministic", "timeline_debug", "avm_debug", "audio", "mp3", "aac", "default_font", "serde"] }
llflash_render = { path = "../../render", features = ["serde"] }
llflash_input_format = { path = "../input-format" }
llflash_socket_format = { path = "../socket-format" }
llflash_video_software = { path = "../../video/software", optional = true }
llflash_video_external = { path = "../../video/external", features = ["openh264"], optional = true }
image = { workspace = true, features = ["png"] }
regex = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
approx = { workspace = true }
pretty_assertions = "1.4.1"
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
vfs = { workspace = true }
percent-encoding = { workspace = true }
cfg-expr = "0.20.7"
oxipng = "10.1.1"
rascal = "0.2.7"
sha2 = { workspace = true }
clap = { workspace = true, optional = true }

[features]
jpegxr = ["llflash_core/jpegxr"]
lzma = ["llflash_core/lzma"]
