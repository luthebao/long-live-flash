[package]
name = "tests"
authors = ["Aaron Hill <aa1ronham@gmail.com>"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Enable running image comparison tests. This is off by default,
# since the images we compare against are generated on CI, and may
# not match your local machine's Vulkan version / image output.
imgtests = [
    "llflash_render_wgpu",
    "llflash_test_framework/llflash_video_software",
    "llflash_test_framework/llflash_video_external",
]
jpegxr = ["llflash_test_framework/jpegxr"]
lzma = ["llflash_test_framework/lzma"]

[dependencies]
llflash_render_wgpu = { path = "../render/wgpu", optional = true }

[dev-dependencies]
llflash_core = { path = "../core", features = ["deterministic", "timeline_debug", "avm_debug", "audio", "mp3", "aac", "default_font"] }
llflash_test_framework = { path = "framework", features = ["clap"] }
llflash_fs_tests_runner = { path = "fs-tests-runner" }
libtest-mimic = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true, features = ["png"] }
futures = { workspace = true }
env_logger = "0.11.10"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[[test]]
name = "tests"
harness = false
path = "tests/regression_tests.rs"
