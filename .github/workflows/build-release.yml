name: Build & publish to target release

# Manual trigger. Builds the llflash-rtmp-host native messaging binary
# for macOS/Windows/Linux and ships it with versioned install bootstrap
# scripts. Resolves APP_VERSION from [workspace.package].version in
# Cargo.toml, then publishes every artifact to a release tag on a
# *different* repo — all targeting is via secrets so this file stays
# repo-portable.
#
# Required secrets:
#   TARGET_REPO         — destination repo in `owner/repo` form
#   TARGET_RELEASE_TAG  — release tag on the destination repo
#   RELEASE_PAT         — PAT (or fine-grained token) with `contents: write`
#                         on TARGET_REPO

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    preflight:
        name: Preflight (verify secrets + resolve version)
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        env:
            TARGET_REPO: ${{ secrets.TARGET_REPO }}
            TARGET_RELEASE_TAG: ${{ secrets.TARGET_RELEASE_TAG }}
            RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        steps:
            - uses: actions/checkout@v4

            - name: Ensure all required secrets are configured
              run: |
                  : "${TARGET_REPO:?TARGET_REPO secret is empty (expect owner/repo)}"
                  : "${TARGET_RELEASE_TAG:?TARGET_RELEASE_TAG secret is empty}"
                  : "${RELEASE_PAT:?RELEASE_PAT secret is empty}"
                  echo "All required secrets present."

            # Parse [workspace.package].version directly to avoid pulling in
            # the Rust toolchain just to run `cargo metadata`.
            - name: Resolve version from Cargo.toml
              id: version
              run: |
                  VERSION=$(awk -F'"' '
                      /^\[workspace.package\]/ { flag=1; next }
                      /^\[/                    { flag=0 }
                      flag && /^version *=/    { print $2; exit }
                  ' Cargo.toml)
                  : "${VERSION:?Could not parse [workspace.package].version from Cargo.toml}"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Resolved version: $VERSION"

    macos:
        name: macOS arm64 (rtmp host)
        needs: preflight
        runs-on: macos-14
        env:
            APP_VERSION: ${{ needs.preflight.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Install stable Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Build llflash_rtmp_host (release)
              run: cargo build --release -p llflash_rtmp_host

            - name: Package llflash-rtmp-host (.tar.gz)
              run: |
                  STAGE="bin/llflash-rtmp-host"
                  rm -rf bin
                  mkdir -p "$STAGE"
                  cp target/release/llflash-rtmp-host "$STAGE/"
                  cp -R native-host/manifest "$STAGE/manifest"
                  cp native-host/install.sh "$STAGE/install.sh"
                  tar -C bin -czf \
                      "bin/llflash-rtmp-host-${APP_VERSION}-macOS-arm64.tar.gz" \
                      llflash-rtmp-host

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: macOS
                  if-no-files-found: error
                  path: bin/llflash-rtmp-host-${{ needs.preflight.outputs.version }}-macOS-arm64.tar.gz

    windows:
        name: Windows x64 (rtmp host)
        needs: preflight
        # Pin to Server 2022 (NT 10.0.20348 — same kernel branch as Windows
        # 10 21H2) so the produced binary's min-supported OS stays
        # compatible with Windows 10. `windows-latest` will eventually roll
        # forward to Server 2025; this pin prevents drift.
        runs-on: windows-2022
        env:
            APP_VERSION: ${{ needs.preflight.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Install stable Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Build llflash_rtmp_host (release)
              shell: pwsh
              run: cargo build --release -p llflash_rtmp_host

            - name: Assemble rtmp host dist folder
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path dist/llflash-rtmp-host | Out-Null
                  Copy-Item target/release/llflash-rtmp-host.exe dist/llflash-rtmp-host/
                  Copy-Item -Recurse native-host/manifest dist/llflash-rtmp-host/manifest
                  Copy-Item native-host/install.ps1 dist/llflash-rtmp-host/install.ps1

            - name: Zip rtmp host
              shell: pwsh
              run: |
                  Compress-Archive `
                      -Path dist/llflash-rtmp-host `
                      -DestinationPath "dist/llflash-rtmp-host-$env:APP_VERSION-Windows-x64.zip"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Windows
                  if-no-files-found: error
                  path: dist/llflash-rtmp-host-${{ needs.preflight.outputs.version }}-Windows-x64.zip

    linux:
        name: Linux x64 (rtmp host)
        needs: preflight
        # Pinned to 22.04 (glibc 2.35) so the resulting binary runs on most
        # current desktop distros without "GLIBC_2.38 not found" errors.
        runs-on: ubuntu-22.04
        env:
            APP_VERSION: ${{ needs.preflight.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Install stable Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Build llflash_rtmp_host (release)
              run: cargo build --release -p llflash_rtmp_host

            - name: Package llflash-rtmp-host (.tar.gz)
              run: |
                  STAGE="dist/llflash-rtmp-host"
                  rm -rf dist
                  mkdir -p "$STAGE"
                  cp target/release/llflash-rtmp-host "$STAGE/"
                  cp -R native-host/manifest "$STAGE/manifest"
                  cp native-host/install.sh "$STAGE/install.sh"
                  tar -C dist -czf \
                      "dist/llflash-rtmp-host-${APP_VERSION}-Linux-x64.tar.gz" \
                      llflash-rtmp-host

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Linux
                  if-no-files-found: error
                  path: dist/llflash-rtmp-host-${{ needs.preflight.outputs.version }}-Linux-x64.tar.gz

    release:
        name: Publish to target repo release
        needs: [preflight, macos, windows, linux]
        runs-on: ubuntu-latest
        env:
            APP_VERSION: ${{ needs.preflight.outputs.version }}
        steps:
            # We need native-host/install.{sh,ps1} from the repo so we can
            # stamp them with the version and upload them as release assets.
            - uses: actions/checkout@v4

            # `merge-multiple: true` flattens all artifact dirs into one
            # `release/` folder so the file globs below stay simple.
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release
                  merge-multiple: true

            # Install bootstrap scripts. Names stay un-versioned so the
            # one-liner URLs are stable: end users always paste the same
            # `.../rtmp-host-install.sh` or `.../rtmp-host-install.ps1`
            # link. The scripts hit the GitHub API at runtime to find the
            # matching binary tarball for whatever version is currently
            # attached to this tag.
            - name: Stage install bootstrap scripts
              run: |
                  cp native-host/install.sh  release/rtmp-host-install.sh
                  cp native-host/install.ps1 release/rtmp-host-install.ps1

            # Delete every asset currently attached to TARGET_TAG before
            # uploading the new ones. This guarantees old rtmp-host
            # binaries from previous releases are removed — without it,
            # softprops/action-gh-release@v2 only overwrites assets whose
            # filenames match exactly, so stale versions accumulate
            # forever. Scoped to this one tag — other releases on
            # TARGET_REPO are untouched.
            - name: Clear old assets from target release
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_PAT }}
                  TARGET_REPO: ${{ secrets.TARGET_REPO }}
                  TARGET_TAG: ${{ secrets.TARGET_RELEASE_TAG }}
              run: |
                  if ! gh release view "$TARGET_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
                      echo "Release $TARGET_TAG does not exist yet on $TARGET_REPO — nothing to clear."
                      exit 0
                  fi
                  gh release view "$TARGET_TAG" \
                      --repo "$TARGET_REPO" \
                      --json assets \
                      --jq '.assets[].name' \
                      | while IFS= read -r asset; do
                          [ -z "$asset" ] && continue
                          echo "Deleting old asset: $asset"
                          gh release delete-asset "$TARGET_TAG" "$asset" \
                              --repo "$TARGET_REPO" --yes
                      done

            - name: Publish to target repo release
              uses: softprops/action-gh-release@v2
              with:
                  repository: ${{ secrets.TARGET_REPO }}
                  token: ${{ secrets.RELEASE_PAT }}
                  tag_name: ${{ secrets.TARGET_RELEASE_TAG }}
                  name: ${{ secrets.TARGET_RELEASE_TAG }}
                  body: |
                      Long Live Flash `${{ needs.preflight.outputs.version }}` — RTMP native messaging host.
                      Source commit: `${{ github.sha }}` on `${{ github.ref_name }}`.
                  prerelease: false
                  # Don't promote this tag over whatever the target repo
                  # already flags as latest.
                  make_latest: "false"
                  files: |
                      release/llflash-rtmp-host-${{ needs.preflight.outputs.version }}-macOS-arm64.tar.gz
                      release/llflash-rtmp-host-${{ needs.preflight.outputs.version }}-Windows-x64.zip
                      release/llflash-rtmp-host-${{ needs.preflight.outputs.version }}-Linux-x64.tar.gz
                      release/rtmp-host-install.sh
                      release/rtmp-host-install.ps1
