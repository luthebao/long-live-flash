[package]
name = "llflash_web"
description = "Web (WASM) bindings to the Llflash Flash player"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false # This crate is useless alone, people should use the npm package

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["canvas", "console_error_panic_hook", "webgl", "wgpu-webgl", "webgpu"]

# core features
avm_debug = ["llflash_core/avm_debug"]
lzma = ["llflash_core/lzma"]
jpegxr = ["llflash_core/jpegxr"]

# web features
canvas = ["llflash_render_canvas"]
webgl = ["llflash_render_webgl"]
webgpu = ["llflash_render_wgpu"]
wgpu-webgl = ["llflash_render_wgpu", "llflash_render_wgpu/webgl"]
profiling = []

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
slotmap = { workspace = true }
js-sys = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
tracing-log = "0.2.0"
tracing-wasm = { workspace = true }
llflash_render_canvas = { path = "../render/canvas", optional = true }
llflash_web_common = { path = "common" }
llflash_render = { path = "../render" }
llflash_render_webgl = { path = "../render/webgl", optional = true }
llflash_render_wgpu = { path = "../render/wgpu", optional = true }
llflash_video_external = { path = "../video/external", features = ["webcodecs"] }
url = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.70"
serde-wasm-bindgen = "0.6.5"
chrono = { workspace = true, features = ["wasmbind", "clock"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
base64 = "0.22.1"
async-channel = { workspace = true }
futures-util = { version = "0.3.30", features = ["sink"] }
gloo-net =  { version = "0.6.0", default-features = false, features = ["websocket"] }
rfd = { workspace = true, features = ["file-handle-inner"] }
wasm-streams = "0.5.0"
futures = { workspace = true }
zip = { version = "8.6.0", default-features = false }

[dependencies.llflash_core]
path = "../core"
features = ["audio", "mp3", "aac", "nellymoser", "default_compatibility_rules", "default_font", "serde"]

[dependencies.web-sys]
workspace = true
features = [
    "AddEventListenerOptions", "AudioBuffer", "AudioBufferSourceNode", "AudioContext",
    "AudioDestinationNode", "AudioNode", "AudioParam", "Blob", "BlobPropertyBag",
    "ChannelMergerNode", "ChannelSplitterNode", "ClipboardEvent", "DataTransfer", "Element",
    "EventTarget", "GainNode", "Headers", "HtmlCanvasElement", "HtmlDocument", "HtmlElement", "HtmlFormElement",
    "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "PageTransitionEvent", "PointerEvent",
    "Request", "RequestInit", "Response", "Storage", "WheelEvent", "Window", "ReadableStream", "RequestCredentials",
    "Url", "WebGlContextEvent", "Clipboard", "FocusEvent", "FocusOptions", "ShadowRoot", "Gamepad", "GamepadButton", "OffscreenCanvas",
    "TextMetrics", "OffscreenCanvasRenderingContext2d"
]

[target.'cfg(target_family = "wasm")'.dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]

[package.metadata.cargo-machete]
ignored = [
    # Not used directly, declared only to enable its `wasm_js` feature on WASM.
    "getrandom"
]
